name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            command: npm run pack:win
          - os: ubuntu-latest
            name: Linux-x64
            command: npm run pack:linux
          - os: macos-latest
            name: macOS
            command: npm run pack:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Loopframe-${{ matrix.name }}
          path: dist/*
